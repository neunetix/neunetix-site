(function(){
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var USD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  var SVG=function(size,sw,paths){return '<svg class="icon " width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>';};
  var SEARCH_ICON=SVG(40,1.5,'<circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path>');

    if((v=val('checkNumber'))){var ck=normRef(v);if(ck)tests.push(function(r){return r.checkNorm.indexOf(ck)>=0;});used++;}
    if((v=val('payer'))){var py=v.toLowerCase();tests.push(function(r){return r.payer.toLowerCase().indexOf(py)>=0;});used++;}

    if((v=val('amount'))){var a=parseMoney(v);if(a===null)return fail('Enter an amount, like 125.00.');tests.push(function(r){return r.total===a||r.depAmt===a||r.lines.some(function(l){return l.p===a||l.b===a;});});used++;}
    if(!used)return fail('Enter something to search for.');

  }
  function show(f,found){

    var n=found.length;
    var head='<div class="page-header" style="margin-top:28px;margin-bottom:12px"><h2 style="margin:0">'+(n===0?'No Results':n+' '+(n===1?'Result':'Results'))+(n===500?' (first 500)':'')+'</h2></div>';
    if(!n){box.innerHTML=head+'<div class="list"><div class="empty-state">'+SEARCH_ICON+'<h3>No Results</h3><p>Try a different spelling or fewer details.</p></div></div>';return;}
    var th='<th>Patient</th><th>Date of Service</th><th class="num">Claim Paid</th><th>Payer</th><th>Check Date</th><th class="num">Check Total</th><th>Deposit</th><th></th>';
    var rows=found.map(function(r){
      var first=esc(r.patient);if(r.href)first='<a class="row-link" style="color:inherit" href="'+esc(r.href)+'">'+first+'</a>';
      return '<tr'+(r.href?' class="clickable"':'')+'><td>'+first+(r.claim?'<span class="cell-sub">'+esc(r.claim)+'</span>':'')+'</td>'+
        '<td>'+esc(r.dos)+'</td><td class="num">'+money(r.paid)+'</td>'+
        '<td>'+esc(r.payer)+(r.check?'<span class="cell-sub">'+esc(r.check)+'</span>':'')+'</td>'+
        '<td class="nowrap">'+fd(r.checkDate)+'</td><td class="num">'+money(r.total)+'</td><td>'+esc(r.deposit)+'</td>'+
        '<td class="chev">'+(r.href?CHEV:'')+'</td></tr>';
    }).join('');
    box.innerHTML=head+'<div class="list"><div class="list-scroll"><table class="data"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }
  document.addEventListener('submit',function(e){var f=e.target.closest&&e.target.closest('form[data-preview-search]');if(!f)return;e.preventDefault();run(f);});
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('form[data-preview-search] button[type=button]');if(!b)return;
    var g=b.form&&b.form.querySelector('.grid-fields');if(g)g.style.display=g.style.display==='none'?'grid':'none';
  });
})();
